[workspace]
name = "sensor-observer"
channels = ["conda-forge"]
platforms = [
    { name = "linux-64-cuda-12-9", platform = "linux-64", cuda = "12.9" },
    { name = "win-64-cuda-12-9", platform = "win-64", cuda = "12.9" },
]

[dependencies]
cuda-toolkit = "12.9.*"
cuda-version = "12.9.*"
libvulkan-headers = ">=1.4.304"
libvulkan-loader = ">=1.4.304"
glslang = "*"
glfw = "*"
cmake = ">=3.28,<4"
ninja = "*"
pkg-config = "*"
cxx-compiler = "*"

[target.linux-64.dependencies]
# The SDK loaders use glibc symbols introduced after 2.28.
sysroot_linux-64 = "2.34.*"

[tasks]
# CMake also honors an externally supplied CMAKE_PREFIX_PATH environment variable.
configure = 'cmake -S . -B build-pixi -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" -DCUDAToolkit_ROOT="$CONDA_PREFIX"'
build = { cmd = "cmake --build build-pixi --config Release --parallel 16", depends-on = ["configure"] }
main = "./build-pixi/sensor-observer"

[target.win-64.tasks]
# Conda packages place Windows headers, libraries, and CUDA under Library/.
# The compiler activation requires installed Visual Studio C++ build tools.
configure = 'cmake -S . -B build-pixi -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$CONDA_PREFIX/Library" -DCUDAToolkit_ROOT="$CONDA_PREFIX/Library" -DFETCHCONTENT_BASE_DIR="$PIXI_PROJECT_ROOT/build-pixi/_deps"'
main = "./build-pixi/Release/sensor-observer.exe"
