[project]
name = "spg-stateful"
version = "0.2.0"
description = "ovrtx Sensor Processing Graph (SPG) stateful node example: framebuffer feedback"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy==2.2.6",
    "ovrtx==0.5.1.385782",
    "ovstage==0.2.1.385922",
    "pillow==12.1.1",
]

[tool.uv]
# Windows reports x86-64 as AMD64 in PEP 508 platform_machine markers.
# Wheel tags still use win_amd64; keep those concepts separate.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

