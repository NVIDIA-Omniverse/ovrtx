[project]
name = "usd-plugin-paths"
version = "0.2.0"
description = "ovrtx usd-plugin-paths example"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "ovrtx==0.7.0.1794596436",
    "usd-core==26.3; python_version < '3.14'",
    "usd-core==26.5; python_version >= '3.14'",
]

[tool.uv]
# Windows reports x86-64 as AMD64 in PEP 508 platform_machine markers.
# Wheel tags still use win_amd64; keep those concepts separate.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]


[dependency-groups]
dev = ["pytest==9.2.0", "Pygments>=2.21.0"]
