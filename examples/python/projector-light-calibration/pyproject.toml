[project]
name = "projector-light-calibration"
version = "0.1.0"
description = "Generate an OpenCV-calibrated projector-light direction texture and render it with ovrtx"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "numpy==2.2.6; python_version < '3.14'",
    "numpy==2.4.6; python_version >= '3.14'",
    "openexr==3.4.3; python_version < '3.14'",
    "openexr==3.5.2; python_version >= '3.14'",
    "opencv-python-headless==4.12.0.88; python_version < '3.14'",
    "opencv-python-headless==4.13.0.92; python_version >= '3.14'",
    "ovrtx==0.7.0.1794596436",
    "ovstage==0.4.0.1794520352",
    "pillow==12.1.1",
    "rerun-sdk==0.29.0",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

