[project]
name = "ovrtx"
version = "0.5.1"
description = "NVIDIA RTX Rendering Python API"
requires-python = ">=3.10,<3.14"
dependencies = []
authors = [{name = "NVIDIA Corporation"}]
license = "LicenseRef-NvidiaProprietary"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Natural Language :: English",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Repository = "https://github.com/NVIDIA-Omniverse/ovrtx"
Changelog = "https://github.com/NVIDIA-Omniverse/ovrtx/blob/main/CHANGELOG.md"

# Note: the documentation toolchain is intentionally not declared here. It requires
# Sphinx >= 8.2, which requires Python >= 3.11, and declaring that would force this
# package's requires-python up to 3.11. See docs/requirements.txt.
[project.optional-dependencies]
test = [
    "pytest==9.0.2",
    "Pillow==12.1.1",
    "numpy>=2.2,<2.3",
    "warp-lang>=1.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ovrtx"]

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
