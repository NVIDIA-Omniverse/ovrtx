<rect x="1004" y="220" width="92" height="58" rx="6" class="empty"/>
<text x="1050" y="254" class="" text-anchor="middle">Step 8</text>
<text x="44" y="320" class="bold" text-anchor="start">40 Hz lidar</text>
<text x="44" y="343" class="small" text-anchor="start">25 ms / scan</text>
