<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" role="img" aria-labelledby="title desc">
<title id="title">Multi-rate sensors: simulation steps, capture periods, and output delivery</title>
<desc id="desc">Eight 25 millisecond simulation steps cover 200 milliseconds. A 40 Hz lidar completes eight scans, while a 20 Hz lidar completes four scans spanning two steps each. With partial outputs disabled, the 20 Hz lidar returns a full scan on even steps. With partial outputs enabled, it returns the first and second scan portions on successive steps. Capture timing is unchanged.</desc>
<style>
text { font-family: Arial, sans-serif; fill: #202b38; font-size: 16px; }
.title { font-size: 28px; font-weight: 700; }
.heading { font-size: 21px; font-weight: 700; }
.bold { font-weight: 700; }
.small { font-size: 14px; fill: #526171; }
.mono { font-family: monospace; font-size: 15px; }
.panel { fill: #f7f9fb; stroke: #cdd5de; }
.full { fill: #d8edb7; stroke: #5d852e; }
.partial { fill: #cce7f6; stroke: #397b9f; }
.empty { fill: #fff; stroke: #8893a3; stroke-dasharray: 5 4; }
.axis { stroke: #647486; stroke-width: 1.5; }
.grid { stroke: #cdd5de; stroke-dasharray: 4 4; }
</style>
<rect width="1180" height="900" fill="#fff"/>
<text x="30" y="42" class="title">Multi-rate sensors: one clock, independent capture rates</text>
<text x="30" y="72">All sensors are requested on every step. Their configured rates determine capture timing.</text>
<rect x="24" y="94" width="1132" height="366" rx="6" class="panel"/>
<text x="44" y="128" class="heading">1  Simulation steps and capture periods</text>
<text x="44" y="158" class="small">Example: scans start at 0 ms; each scan spans one capture period.</text>

