<text x="300" y="190" class="small" text-anchor="middle">0</text>
<line x1="400" y1="194" x2="400" y2="430" class="grid"/>
<text x="400" y="190" class="small" text-anchor="middle">25</text>
<line x1="500" y1="194" x2="500" y2="430" class="grid"/>
<text x="500" y="190" class="small" text-anchor="middle">50</text>
<line x1="600" y1="194" x2="600" y2="430" class="grid"/>
<text x="600" y="190" class="small" text-anchor="middle">75</text>
<line x1="700" y1="194" x2="700" y2="430" class="grid"/>
<text x="700" y="190" class="small" text-anchor="middle">100</text>
<line x1="800" y1="194" x2="800" y2="430" class="grid"/>
<text x="800" y="190" class="small" text-anchor="middle">125</text>
<line x1="900" y1="194" x2="900" y2="430" class="grid"/>
<text x="900" y="190" class="small" text-anchor="middle">150</text>
<line x1="1000" y1="194" x2="1000" y2="430" class="grid"/>
<text x="1000" y="190" class="small" text-anchor="middle">175</text>
<line x1="1100" y1="194" x2="1100" y2="430" class="grid"/>
<text x="1100" y="190" class="small" text-anchor="middle">200</text>
<text x="44" y="190" class="bold" text-anchor="start">Simulation time (ms)</text>
<text x="44" y="246" class="bold" text-anchor="start">Simulation steps</text>
<text x="44" y="270" class="mono" text-anchor="start">delta_time = 25 ms</text>
<rect x="304" y="220" width="92" height="58" rx="6" class="empty"/>
<text x="350" y="254" class="" text-anchor="middle">Step 1</text>
<rect x="404" y="220" width="92" height="58" rx="6" class="empty"/>
<text x="450" y="254" class="" text-anchor="middle">Step 2</text>
<rect x="504" y="220" width="92" height="58" rx="6" class="empty"/>
<text x="550" y="254" class="" text-anchor="middle">Step 3</text>
<rect x="604" y="220" width="92" height="58" rx="6" class="empty"/>
<text x="650" y="254" class="" text-anchor="middle">Step 4</text>
