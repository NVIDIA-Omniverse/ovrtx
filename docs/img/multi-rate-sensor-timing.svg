<text x="1050" y="329" class="" text-anchor="middle">Scan 8</text>
<text x="44" y="395" class="bold" text-anchor="start">20 Hz lidar</text>
<text x="44" y="418" class="small" text-anchor="start">50 ms / scan</text>
<rect x="304" y="374" width="192" height="48" rx="6" class="partial"/>
<text x="400" y="404" class="" text-anchor="middle">Scan 1</text>
<rect x="504" y="374" width="192" height="48" rx="6" class="partial"/>
