<text x="44" y="780" class="small" text-anchor="start">Partial lidar outputs are successive scan portions, not an accumulated full scan.</text>
<text x="30" y="835" class="" text-anchor="start">The 40 Hz lidar completes a scan every step under either policy.</text>
<text x="30" y="864" class="small" text-anchor="start">Camera intermediate outputs depend on the RenderVar; display color can repeat the last completed image.</text>
</svg>
