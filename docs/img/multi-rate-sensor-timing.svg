<rect x="24" y="480" width="1132" height="320" rx="6" class="panel"/>
<text x="44" y="514" class="heading">2  What the 20 Hz lidar returns at each step's end</text>
<text x="44" y="544" class="small">The same four scans above; only the delivery policy changes.</text>

<text x="350" y="579" class="small" text-anchor="middle">25 ms</text>
<text x="450" y="579" class="small" text-anchor="middle">50 ms</text>
<text x="550" y="579" class="small" text-anchor="middle">75 ms</text>
<text x="650" y="579" class="small" text-anchor="middle">100 ms</text>
<text x="750" y="579" class="small" text-anchor="middle">125 ms</text>
<text x="850" y="579" class="small" text-anchor="middle">150 ms</text>
<text x="950" y="579" class="small" text-anchor="middle">175 ms</text>
<text x="1050" y="579" class="small" text-anchor="middle">200 ms</text>
<text x="44" y="615" class="bold" text-anchor="start">Completed scans only</text>
<text x="44" y="641" class="mono" text-anchor="start">partialOutputs = false</text>
<text x="44" y="710" class="bold" text-anchor="start">Scan portions each step</text>
<text x="44" y="736" class="mono" text-anchor="start">partialOutputs = true</text>
