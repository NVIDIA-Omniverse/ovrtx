<rect x="504" y="300" width="92" height="48" rx="6" class="full"/>
<text x="550" y="329" class="" text-anchor="middle">Scan 3</text>
<rect x="604" y="300" width="92" height="48" rx="6" class="full"/>
<text x="650" y="329" class="" text-anchor="middle">Scan 4</text>
<rect x="704" y="300" width="92" height="48" rx="6" class="full"/>
