<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="630" viewBox="0 0 1188 630" role="img" aria-labelledby="title desc">
<title id="title">Radar attribute namespaces</title>
<desc id="desc">A tree with one OmniRadar prim at the root and three branches: omni:sensor:* with the seven identification and rate attributes, omni:sensor:WpmDmat:* with its six per-sensor attributes, the three output attributes highlighted, and omni:sensor:WpmDmat:scan:s001:* and :s002:* instance branches that each hold the per-scan attributes.</desc>
