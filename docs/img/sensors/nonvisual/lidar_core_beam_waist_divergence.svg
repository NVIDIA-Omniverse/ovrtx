<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="596" viewBox="0 0 1100 596" role="img" aria-labelledby="title desc">
<title id="title">Beam waist, divergence and beam quality factor</title>
<desc id="desc">Side view of one beam leaving an emitter: it narrows to its waist at the focus distance and widens beyond it along the divergence angle, with a wider dashed envelope for a beam quality factor above 1 and footprint discs growing with range. Two rows below state which pair is authored and which the model derives, through divergence = M-squared times lambda over pi times waist.</desc>
