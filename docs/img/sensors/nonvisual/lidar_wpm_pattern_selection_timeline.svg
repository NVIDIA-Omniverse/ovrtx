<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title desc">
<title id="title">Pattern selection with two patterns and a dwell of two ticks</title>
<desc id="desc">Top: a rotary sensor numbers its ticks from 0 at every scan boundary; with patterns p001 and p002 and firingPatternDwellTicks = 2, ticks 0 and 1 fire p001, ticks 2 and 3 fire p002, tick 4 fires p001, and the next scan starts with p001 again, three p001 ticks in a row across the boundary. Bottom: a solid-state sensor's tick is the scan itself, counted from time zero, so scans 0 and 1 fire p001, scans 2 and 3 fire p002 and scans 4 and 5 fire p001; a jump in time from scan 1 to scan 4 lands on the pattern of that scan index.</desc>
<defs><marker id="arrow-757575-1p8" markerUnits="userSpaceOnUse" markerWidth="9.9" markerHeight="8.1" refX="0" refY="4.05" orient="auto" overflow="visible"><path d="M0,0 L9.9,4.05 L0,8.1 z" fill="#757575"/></marker></defs>
<rect width="960" height="414" fill="#fff"/>
<text x="30" y="30" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#313131" font-weight="bold">Which pattern fires: two patterns, each held for two ticks</text>
<text x="30" y="48" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#757575">patterns p001, p002; firingPatternDwellTicks = 2</text>
<text x="30" y="80" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#313131" font-weight="bold">Rotary: ticks numbered from 0 at every scan boundary</text>
