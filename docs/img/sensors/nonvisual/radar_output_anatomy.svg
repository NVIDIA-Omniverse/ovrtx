<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="624" viewBox="0 0 1100 624" role="img" aria-labelledby="title desc">
<title id="title">Anatomy of one radar PointCloud output</title>
<desc id="desc">Left: one horizontal bar per per-detection tensor, each 2500 slots wide; Coordinates as three component-first rows x, y, z (or azimuth, elevation, range) and RCS, RadialVelocityMs, TimeOffsetNs and Flags as one row each. In every bar the first Counts[0] slots are filled and the rest are gray. A bracket over the full width reads Nmax = maxPoints = 2500 and one over the filled part reads Counts[0]; a small Counts box points at the boundary. Right: two boxes list the CPU-resident params, the thirteen shared with the Lidar generic core model from frameId to maxPoints and the ten scan params from sensorID to maxElRad.</desc>
<defs><marker id="arrow-313131-2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="0" refY="4.5" orient="auto" overflow="visible"><path d="M0,0 L11,4.5 L0,9 z" fill="#313131"/></marker></defs>
<rect width="1100" height="624" fill="#fff"/>
<line x1="256" y1="80" x2="756" y2="80" stroke="#313131" stroke-width="1.5"/>
<line x1="256" y1="80" x2="256" y2="86" stroke="#313131" stroke-width="1.5"/>
<line x1="756" y1="80" x2="756" y2="86" stroke="#313131" stroke-width="1.5"/>
<text x="338.95" y="70" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131">Nmax = maxPoints = 2500</text>
<text x="510.11" y="70" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#313131">slots allocated in every bar</text>
<line x1="256" y1="116" x2="356" y2="116" stroke="#313131" stroke-width="1.5"/>
<line x1="256" y1="116" x2="256" y2="122" stroke="#313131" stroke-width="1.5"/>
<line x1="356" y1="116" x2="356" y2="122" stroke="#313131" stroke-width="1.5"/>
<text x="242.94" y="108" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131">Counts[0]</text>
<text x="312.96" y="108" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#313131">delivered</text>
<rect x="256" y="130" width="500" height="26" fill="#C0C0C0"/>
<rect x="256" y="130" width="100" height="26" fill="#76B900"/>
<text x="246" y="147" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="11" fill="#757575" text-anchor="end">x (az)</text>
<rect x="256" y="158" width="500" height="26" fill="#C0C0C0"/>
<rect x="256" y="158" width="100" height="26" fill="#76B900"/>
<text x="246" y="175" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="11" fill="#757575" text-anchor="end">y (el)</text>
<rect x="256" y="186" width="500" height="26" fill="#C0C0C0"/>
<rect x="256" y="186" width="100" height="26" fill="#76B900"/>
<text x="246" y="203" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="11" fill="#757575" text-anchor="end">z (range)</text>
<text x="180" y="167" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131" text-anchor="end" font-weight="bold">Coordinates</text>
<text x="180" y="183" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="11" fill="#757575" text-anchor="end">float32 [3, Nmax]</text>
<text x="306" y="147" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#313131" text-anchor="middle">delivered</text>
<text x="556" y="147" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#313131" text-anchor="middle">past Counts[0]: not detections, do not read</text>
<text x="256" y="227" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#757575">component-first: all x, then all y, then all z; strides [Nmax, 1]</text>
<rect x="256" y="244" width="500" height="34" fill="#C0C0C0"/>
<rect x="256" y="244" width="100" height="34" fill="#76B900"/>
<text x="180" y="257" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131" text-anchor="end" font-weight="bold">RCS</text>
<text x="180" y="273" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="11" fill="#757575" text-anchor="end">float32 [Nmax] dBsm</text>
<rect x="256" y="290" width="500" height="34" fill="#C0C0C0"/>
<rect x="256" y="290" width="100" height="34" fill="#76B900"/>
<text x="180" y="303" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131" text-anchor="end" font-weight="bold">RadialVelocityMs</text>
