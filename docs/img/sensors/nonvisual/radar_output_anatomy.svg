<rect x="256" y="336" width="100" height="34" fill="#76B900"/>
<text x="180" y="349" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131" text-anchor="end" font-weight="bold">TimeOffsetNs</text>
<text x="180" y="365" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="11" fill="#757575" text-anchor="end">int32 [Nmax] ns</text>
<text x="306" y="357" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="11" fill="#313131" text-anchor="middle">all 0</text>
<rect x="256" y="382" width="500" height="34" fill="#C0C0C0"/>
<rect x="256" y="382" width="100" height="34" fill="#76B900"/>
<text x="180" y="395" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131" text-anchor="end" font-weight="bold">Flags</text>
<text x="180" y="411" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="11" fill="#757575" text-anchor="end">uint8 [Nmax]</text>
<text x="306" y="403" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="11" fill="#313131" text-anchor="middle">VALID 0x40</text>
<rect x="320" y="444" width="72" height="26" rx="4" fill="#fff" stroke="#313131" stroke-width="1.5"/>
<text x="356" y="461" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="11" fill="#313131" text-anchor="middle" font-weight="bold">Counts</text>
<line x1="356" y1="444" x2="356" y2="428" stroke="#313131" stroke-width="2" marker-end="url(#arrow-313131-2)"/>
<text x="402" y="455" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131">Counts int32 [1]:</text>
<text x="529.81" y="455" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#313131">the delivered count;</text>
<text x="402" y="472" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#313131">read every bar up to it, never to its length</text>
<rect x="256" y="506" width="12" height="12" rx="2" fill="#76B900"/>
<text x="275" y="516.32" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#313131">delivered entries, indices [0, Counts[0])</text>
<rect x="256" y="526" width="12" height="12" rx="2" fill="#C0C0C0"/>
<text x="275" y="536.32" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#313131">allocated but past Counts[0]: not detections</text>
<rect x="796" y="40" width="280" height="297.5" rx="8" fill="#F2F2F2"/>
