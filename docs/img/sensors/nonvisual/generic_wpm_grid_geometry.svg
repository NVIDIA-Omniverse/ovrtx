<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">Generic wpm model grid geometry</title>
<desc id="desc">Three illustrative three-by-three grids before the pattern pose. Spherical grids share one origin and vary elevation by row and azimuth by column. Planar grids place origins in Y and Z with every local X axis pointing in the positive X direction. Cylindrical grids place origins along Z and vary azimuth by column. Green dots mark element origins; blue arrows show element orientation, not receiver acceptance cones.</desc>
