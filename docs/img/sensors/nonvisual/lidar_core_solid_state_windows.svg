<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
<title id="title">A solid-state scan over two simulation steps</title>
<desc id="desc">A solid-state scan on a time axis with scan period boundaries, fire-time groups and, in a second lane, a flash group; two simulation steps with half-open windows, the group on the step boundary firing in the later step, and the step that reaches the period end completing the scan and advancing the emitter state.</desc>
<defs><marker id="arrow-0074df-1p5" markerUnits="userSpaceOnUse" markerWidth="8.25" markerHeight="6.75" refX="0" refY="3.38" orient="auto" overflow="visible"><path d="M0,0 L8.25,3.38 L0,6.75 z" fill="#0074DF"/></marker><marker id="arrow-313131-1p2" markerUnits="userSpaceOnUse" markerWidth="6.6" markerHeight="5.4" refX="0" refY="2.7" orient="auto" overflow="visible"><path d="M0,0 L6.6,2.7 L0,5.4 z" fill="#313131"/></marker><marker id="arrow-757575-1p5" markerUnits="userSpaceOnUse" markerWidth="8.25" markerHeight="6.75" refX="0" refY="3.38" orient="auto" overflow="visible"><path d="M0,0 L8.25,3.38 L0,6.75 z" fill="#757575"/></marker><marker id="arrow-952fc6-1p5" markerUnits="userSpaceOnUse" markerWidth="8.25" markerHeight="6.75" refX="0" refY="3.38" orient="auto" overflow="visible"><path d="M0,0 L8.25,3.38 L0,6.75 z" fill="#952FC6"/></marker></defs>
<rect width="1180" height="650" fill="#fff"/>
<line x1="210" y1="78" x2="830" y2="78" stroke="#313131" stroke-width="1.2"/>
<line x1="210" y1="73" x2="210" y2="83" stroke="#313131" stroke-width="1.2"/>
<line x1="830" y1="73" x2="830" y2="83" stroke="#313131" stroke-width="1.2"/>
<text x="520" y="70" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#313131" xml:space="preserve" text-anchor="middle"><tspan font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif">scan period = </tspan><tspan font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace">1 / frameRate</tspan></text>
<text x="210" y="100" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#313131" text-anchor="middle" font-weight="bold">scan start</text>
<text x="210" y="116" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="11" fill="#757575" text-anchor="middle">startTime + k * (1 / frameRate)</text>
<text x="830" y="100" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#313131" text-anchor="middle" font-weight="bold">scan end, next scan start</text>
<text x="830" y="116" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="11" fill="#757575" text-anchor="middle">startTime + (k + 1) * (1 / frameRate)</text>
<rect x="24" y="128" width="1132" height="92" rx="4" fill="#F2F2F2"/>
<text x="36" y="178.68" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#313131" font-weight="bold">flash pattern</text>
<line x1="154" y1="134" x2="154" y2="214" stroke="#C0C0C0" stroke-width="1"/>
<text x="36" y="196" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#757575">every emitter shares</text>
<text x="36" y="212" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="11" fill="#757575">one fireTimeNs</text>
<rect x="24" y="232" width="1132" height="130" rx="4" fill="#F2F2F2"/>
<text x="36" y="301.68" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#313131" font-weight="bold">several groups</text>
<line x1="154" y1="238" x2="154" y2="356" stroke="#C0C0C0" stroke-width="1"/>
<text x="36" y="319" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#757575">emitters with equal</text>
<text x="36" y="335" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#757575">fire times form a group</text>
<line x1="210" y1="124" x2="210" y2="600" stroke="#757575" stroke-width="1.5" stroke-dasharray="4.5 3"/>
<line x1="830" y1="124" x2="830" y2="600" stroke="#757575" stroke-width="1.5" stroke-dasharray="4.5 3"/>
<circle cx="400" cy="204" r="4.5" fill="#0074DF"/>
