<circle cx="480" cy="468" r="5.5" fill="#952FC6"/>
<circle cx="830" cy="468" r="5.5" fill="#952FC6"/>
<text x="655" y="486" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#313131" xml:space="preserve" text-anchor="middle"><tspan font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif">step 2: </tspan><tspan font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace">[boundary, scan end]</tspan></text>
<text x="466" y="472" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#952FC6" text-anchor="end">boundary group fires in the later step</text>
<circle cx="830" cy="468" r="9" fill="none" stroke="#76B900" stroke-width="2.5"/>
<text x="846" y="464" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#76B900">scan completes here;</text>
<text x="846" y="480" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#76B900" xml:space="preserve"><tspan font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif">emitter state advances (</tspan><tspan font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace">s001 → s002</tspan><tspan font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif">)</tspan></text>
<text x="846" y="496" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#757575">the closing step also fires the group at the scan end</text>
<text x="820" y="522" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#757575" text-anchor="end">a step that crosses a scan boundary</text>
<text x="820" y="538" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#757575" text-anchor="end">is split into one window per scan</text>
