<circle cx="400" cy="150" r="4.5" fill="#0074DF"/>
<circle cx="400" cy="141" r="4.5" fill="#0074DF"/>
<text x="416" y="160" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#313131" xml:space="preserve"><tspan font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif">flash group: every emitter shares one </tspan><tspan font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace">fireTimeNs</tspan><tspan font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif">,</tspan></text>
<text x="416" y="176" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#313131">so the whole pattern is one group that fires once per scan,</text>
<text x="416" y="192" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#313131">in whichever step holds that time (step 1 here)</text>
