<text x="480" y="310" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#757575" text-anchor="middle">on the step boundary</text>
<text x="820" y="330" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#757575" text-anchor="end">timed exactly at the scan end</text>
<line x1="154" y1="392" x2="1131.75" y2="392" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow-757575-1p5)"/>
