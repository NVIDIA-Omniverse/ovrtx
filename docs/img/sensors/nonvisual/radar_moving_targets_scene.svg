<svg xmlns="http://www.w3.org/2000/svg" width="994" height="536" viewBox="0 0 994 536" role="img" aria-labelledby="title desc">
<title id="title">The radar example scene from above</title>
<desc id="desc">Top-down sketch, X to the right and Y up, in meters. The radar sits at the origin and looks along +X over an asphalt ground plane. A steel cube travels along the line y = 4 from x = 30 to x = 20, one meter per 0.1 s step, toward the radar; its detections report a negative RadialVelocityMs near -10 m/s. A concrete cube stays at (30, -4) and reports a radial velocity near zero. A dashed line of sight joins the radar to the steel cube. The shaded wedge is the field of view at the schema defaults; both cubes lie well inside it.</desc>
