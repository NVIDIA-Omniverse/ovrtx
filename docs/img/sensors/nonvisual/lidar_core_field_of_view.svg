<text x="181.97" y="483.53" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="11.5" fill="#313131" text-anchor="end">farRangeM</text>
<text x="280" y="504" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#757575" text-anchor="middle">range band</text>
