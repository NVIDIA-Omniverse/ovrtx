<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="690" viewBox="0 0 1180 690" role="img" aria-labelledby="title desc">
<title id="title">The three windows of a rotary sensor</title>
<desc id="desc">Top-down view of a rotary sensor with +X forward. An annulus between nearRangeM and farRangeM marks the range band. An arc measured clockwise from +X on the firing angle runs from validStartAzimuthDeg to validEndAzimuthDeg, next to a second, wrapping example that passes through 360 degrees. A separate arc marks the region of interest between minAzimuthROI and maxAzimuthROI.</desc>
<defs><marker id="arrow-0074df-2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="0" refY="4.5" orient="auto" overflow="visible"><path d="M0,0 L11,4.5 L0,9 z" fill="#0074DF"/></marker><marker id="arrow-313131-1p5" markerUnits="userSpaceOnUse" markerWidth="8.25" markerHeight="6.75" refX="0" refY="3.38" orient="auto" overflow="visible"><path d="M0,0 L8.25,3.38 L0,6.75 z" fill="#313131"/></marker></defs>
<rect width="1180" height="690" fill="#fff"/>
