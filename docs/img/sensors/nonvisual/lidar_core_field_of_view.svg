<text x="585" y="572" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#757575">ROI interval: where ROI-tagged states fire,</text>
<text x="585" y="588" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#757575">not the field of view</text>
<line x1="390" y1="165" x2="390" y2="147.25" stroke="#313131" stroke-width="1.5" marker-end="url(#arrow-313131-1p5)"/>
<text x="390" y="131" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#313131" text-anchor="middle">+X forward</text>
<text x="960" y="82" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#313131" text-anchor="middle" font-weight="bold">A wrapping window</text>
<text x="960" y="100" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#757575" text-anchor="middle">start &gt; end wraps through 360°</text>
<text x="960" y="118" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="11" fill="#313131" text-anchor="middle">validStartAzimuthDeg = 300, validEndAzimuthDeg = 60</text>
