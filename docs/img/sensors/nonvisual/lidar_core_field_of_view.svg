<text x="530.81" y="263.19" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#313131">delivered return</text>
<circle cx="535.77" cy="189.36" r="5" fill="#fff" stroke="#757575" stroke-width="2"/>
<text x="547.77" y="193.36" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#313131" xml:space="preserve"><tspan font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif">beyond </tspan><tspan font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace">farRangeM</tspan><tspan font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif">, not delivered</tspan></text>
<circle cx="420.97" cy="345.77" r="5" fill="#fff" stroke="#757575" stroke-width="2"/>
<text x="432.97" y="341.77" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#313131" xml:space="preserve"><tspan font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif">inside </tspan><tspan font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace">nearRangeM</tspan><tspan font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif">,</tspan></text>
<text x="432.97" y="357.77" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#313131">not delivered</text>
