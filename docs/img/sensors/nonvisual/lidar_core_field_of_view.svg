<circle cx="390" cy="390" r="215" fill="#F2F2F2" stroke="#C0C0C0" stroke-width="1.5"/>
<circle cx="390" cy="390" r="75" fill="#fff" stroke="#C0C0C0" stroke-width="1.5"/>
