<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1140" viewBox="0 0 1000 1140" role="img" aria-labelledby="title desc">
<title id="title">Generic wpm model trace definition</title>
<desc id="desc">Global propagation settings sit above four connected panels. At upper left, activeTxPatternIndex selects transmitter pattern 0, containing Tx 0 and Tx 1. Its shared rayPatternIndices entry selects ray pattern 1, a three-ray Gaussian bundle at upper right. Its shared mappingTargetRxGroups entry selects group 0 in mapping page 0 at lower right; activeMappingPageIndex selects that page. Group 0 contains the ordered receiver indices 2, 0. Separate purple arrows connect entry 2 to the Rx 2 cell and entry 0 to the Rx 0 cell in receiver pattern 0 at lower left, selected independently by activeRxPatternIndex. Unselected pattern rows and stacked mapping pages remain visible. Green, blue, purple and orange outlines mark the selected Tx, ray, Rx and mapping data. The illustrated map connection is one of nton, 1to1 with bloom, and map.</desc>
