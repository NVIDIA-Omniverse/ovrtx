<text x="184" y="606" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#313131" xml:space="preserve"><tspan font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif">The whole pattern is one tick, applied once per scan, with its emitters laid out in lines (</tspan><tspan font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace">numLines</tspan><tspan font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif">, </tspan><tspan font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace">numRaysPerLine</tspan><tspan font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif">).</tspan></text>
<text x="184" y="623" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#313131" xml:space="preserve"><tspan font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace">rotPatternFiringResDeg</tspan><tspan font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif"> is not read; the angular extent comes from the emitter </tspan><tspan font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace">azimuthDeg</tspan><tspan font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif"> and </tspan><tspan font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace">elevationDeg</tspan><tspan font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif"> arrays.</tspan></text>
<text x="184" y="640" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#313131" xml:space="preserve"><tspan font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif">Every point of a solid-state scan carries </tspan><tspan font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace">TickId</tspan><tspan font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif"> 0.</tspan></text>
