<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="700" viewBox="0 0 1140 700" role="img" aria-labelledby="title desc">
<title id="title">Anatomy of a firing pattern</title>
<desc id="desc">A rotary sensor seen from above with ticks spaced by rotPatternFiringResDeg around the rotation; one tick is expanded into its emitters fanned out by azimuthDeg and elevationDeg, with their fireTimeNs offsets on a time axis beneath. Panels show scan scheduling and an emitter-state API instance; a band beneath shows a solid-state sensor with one tick per scan.</desc>
