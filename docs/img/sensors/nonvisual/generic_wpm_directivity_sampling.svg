<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
<title id="title">Generic wpm model directivity and ray sampling</title>
<desc id="desc">Two rows relate a directional shape to sampled rays. The upper row shows a broad blue polar angular-density curve on the left and seventeen equal-length blue ray arrows on the right. The lower row shows a narrower green density curve and the same seventeen ray arrows concentrated around the forward axis. Both curves and samples use corresponding Gaussian azimuth distributions. The curves show relative angular sampling density, without a gain or distance scale. Green dots mark a common local origin. The diagrams are illustrative azimuth sections; finite samples do not bound the Gaussian distribution.</desc>
