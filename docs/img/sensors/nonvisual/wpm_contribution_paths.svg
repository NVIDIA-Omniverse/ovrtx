<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">How contributions arise along one traced path</title>
<desc id="desc">A sensor with a transmitter Tx and a receiver Rx side by side at the bottom. The primary ray leaves Tx and meets a transparent pane (hit 1), where it reflects to a wall (hit 2) and back to the pane (hit 3); there the path passes through the pane, bent toward its normal, to an object behind it (hit 4) and goes on toward the depth of the trace. From every hit a contribution ray runs straight back to Rx; the one from hit 4 crosses the pane again. At hits 1 and 2 the surface's response is drawn as a lobe, sampled in the continuation's direction and toward Rx; at hit 3 the lobe sits on both sides of the pane. The path Tx, pane, wall, Rx is highlighted as one contribution with its three segment lengths; the rays thin with every hit. A legend at the top left names the ray types.</desc>
