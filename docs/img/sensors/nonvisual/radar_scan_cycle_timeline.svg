<svg xmlns="http://www.w3.org/2000/svg" width="1016" height="446" viewBox="0 0 1016 446" role="img" aria-labelledby="title desc">
<title id="title">Radar scan cycle and velocity sequence</title>
<desc id="desc">Eight capture windows for scans s001 and s002, each with maxVelMpsSequence [50, 55] meters per second. Firings alternate scans and advance only that scan's sequence. Windows three and six contain no acquisition and publish no radar frame; the pending scan and both sequence entries remain unchanged.</desc>
