<text x="24" y="36" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12.5" fill="#313131">maxVelMpsSequence = [50, 55]</text>
<text x="239.2" y="36" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#757575">(m/s); two scans, s001 and s002</text>
<text x="992" y="36" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#757575" text-anchor="end">only firings advance the active scan and its sequence →</text>
