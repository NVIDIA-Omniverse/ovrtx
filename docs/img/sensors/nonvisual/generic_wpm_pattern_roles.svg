<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="645" viewBox="0 0 1000 645" role="img" aria-labelledby="title desc">
<title id="title">Local ray poses reused at every transmitter</title>
<desc id="desc">One selected ray pattern contains three illustrative ray origins and orientations. The entire pattern is repeated at both elements of the selected transmitter pattern. The second transmitter is rotated, so all three ray origins and directions rotate with it. Transmitter and receiver poses are relative to the sensor; ray poses are relative to each transmitter. Receiver markers show independent positions, not acceptance cones. Ray, transmitter, and sensor poses compose into a world ray pose.</desc>
