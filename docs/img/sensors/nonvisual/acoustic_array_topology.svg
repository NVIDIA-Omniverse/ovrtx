<title id="title">Mounts, receiver groups and firing sequences of an acoustic array</title>
<desc id="desc">Two mounts m001 and m002 placed in the sensor frame, two receiver groups as sets of mount indices, a firing sequence as four parallel arrays with one column per event, and the signal ways the two events write.</desc>
