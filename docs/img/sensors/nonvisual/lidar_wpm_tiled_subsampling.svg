<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="514" viewBox="0 0 1000 514" role="img" aria-labelledby="title desc">
<title id="title">What a tiledSubSampling factor of 2 keeps on the Lidar generic wpm model</title>
<desc id="desc">Two panels. Left, a rotary scan: the emitter rows of one sweep drawn as ticks around the full revolution in firing order, one of every two kept and the other faded, so the kept rows are spread evenly over the complete scan and the sweep is still covered. Right, a solid-state scan: two firing patterns of eight rows each, one of every two rows kept inside each pattern independently, because only one pattern fires in a scan. The row counts are illustrative.</desc>
