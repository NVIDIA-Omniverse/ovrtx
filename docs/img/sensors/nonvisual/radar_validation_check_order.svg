<text x="427" y="154" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<text x="427" y="178" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Doppler and</text>
<text x="427" y="195" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">ambiguity</text>
<text x="427" y="248" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#757575" text-anchor="middle">velocity sign,</text>
<text x="427" y="264" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#757575" text-anchor="middle">resolution, folding</text>
