<text x="99" y="178" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Coordinates and</text>
<text x="99" y="195" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">coverage</text>
<text x="99" y="248" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#757575" text-anchor="middle">range, angle, frame of</text>
<text x="99" y="264" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#757575" text-anchor="middle">reference, rejection</text>
<rect x="194" y="124" width="138" height="104" rx="8" fill="#0074DF"/>
<text x="263" y="154" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<text x="263" y="178" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Resolution and</text>
<text x="263" y="195" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">accuracy</text>
<text x="263" y="248" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#757575" text-anchor="middle">separation, then</text>
<text x="263" y="264" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#757575" text-anchor="middle">measurement error</text>
