<svg xmlns="http://www.w3.org/2000/svg" width="1182" height="288" viewBox="0 0 1182 288" role="img" aria-labelledby="title desc">
<title id="title">The seven radar validation checks in dependency order</title>
<desc id="desc">Seven boxes joined left to right by arrows: 1 coordinates and coverage, 2 resolution and accuracy, 3 Doppler and ambiguity, 4 materials and antenna response, 5 multipath, 6 detection filtering, 7 timing and scans. A band above the first five says to tune CFAR and noise only after they are stable and points at box 6. Under box 7: frame rate, scan order, motion BVH.</desc>
<defs><marker id="arrow-757575-2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="0" refY="4.5" orient="auto" overflow="visible"><path d="M0,0 L11,4.5 L0,9 z" fill="#757575"/></marker><marker id="arrow-ef9100-2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="0" refY="4.5" orient="auto" overflow="visible"><path d="M0,0 L11,4.5 L0,9 z" fill="#EF9100"/></marker></defs>
<rect width="1182" height="288" fill="#fff"/>
