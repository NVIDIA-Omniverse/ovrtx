<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560" role="img" aria-labelledby="title desc">
<title id="title">Dense and compact point layouts of a two-tile aggregate</title>
<desc id="desc">Top, dense output: twelve capacity slots in tile-major, row-major, return-major order for two tiles with receiversPerTile 3 and maxReturns 2; the VALID bit of Flags marks the six slots that hold a return, tileStridePoints = 6 and receiverStridePoints = 2 locate a slot and Counts[0] = 12 is the capacity. Bottom, compact output: the same six returns gathered into a prefix of length Counts[0] = 6 in the same order, TilePointOffsets = [0, 3, 6] and TilePointCounts = [3, 3] saying where each tile's returns are, and the six remaining slots unspecified with Flags 0.</desc>
<defs><marker id="arrow-757575-2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="0" refY="4.5" orient="auto" overflow="visible"><path d="M0,0 L11,4.5 L0,9 z" fill="#757575"/></marker></defs>
