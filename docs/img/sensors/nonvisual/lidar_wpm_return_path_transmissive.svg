<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
<title id="title">What each return-processing mode can see through</title>
<desc id="desc">Three plan views of a pulse that passes a glass pane and hits a wall. Left, waveform mode: the return from the wall crosses the pane on its way back and is accepted, attenuated. Middle, directDetector or directMaterial mode: the return is blocked at the pane, so only the pane itself can be reported. Right, waveform mode with two panes: the return crosses the first pane it meets and is blocked at the second.</desc>
