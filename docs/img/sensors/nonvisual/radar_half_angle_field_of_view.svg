<circle cx="150" cy="338" r="5" fill="#313131"/>
<text x="138" y="356" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#757575" text-anchor="end">radar</text>
<text x="136" y="278" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#757575" text-anchor="end">outside the limits:</text>
<text x="136" y="296" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#757575" text-anchor="end">gain 0</text>
