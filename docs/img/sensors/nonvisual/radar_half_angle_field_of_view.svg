<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-labelledby="title desc">
<title id="title">Radar half-angle field of view</title>
<desc id="desc">A top view and a side view of a radar. In the top view the azimuth field of view spans from minus maxAzAngDeg to plus maxAzAngDeg, with the COSINE_FALLOFF gain curve at its peak on boresight and falling to zero at both limits; a 150-degree field of view is labeled as authored with maxAzAngDeg = 75. The side view shows the same symmetric interval for elevation, from minus maxElAngDeg to plus maxElAngDeg.</desc>
<rect width="1080" height="660" fill="#fff"/>
<text x="310" y="36" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#313131" text-anchor="middle" font-weight="bold">Top view: azimuth</text>
