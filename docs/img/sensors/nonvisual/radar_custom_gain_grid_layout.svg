<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="504" viewBox="0 0 1000 504" role="img" aria-labelledby="title desc">
<title id="title">Radar custom gain grid layout</title>
<desc id="desc">A grid with the azimuth angles of AzDeg along the top and the elevation angles of ElDeg down the side, each cell holding the sum of a co-polarization and a cross-polarization gain. Beside it the same values laid out as the one-dimensional gain array: the first row of the grid, for the first elevation angle, walking every azimuth angle, then the second row, and so on.</desc>
