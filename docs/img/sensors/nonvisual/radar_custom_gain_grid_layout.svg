<text x="500" y="72" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#313131" font-weight="bold">Rules for a custom grid</text>
<text x="500" y="94" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#313131">AzDeg and ElDeg:</text>
<text x="617.17" y="94" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12.5" fill="#313131">txAntennaAzDeg, txAntennaElDeg</text>
<text x="500" y="116" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12.5" fill="#313131">length = len(ElDeg) × len(AzDeg)</text>
<text x="745.3" y="116" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#757575">→ 2 × 3 = 6 here</text>
<text x="500" y="138" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#313131">angles ordered lowest to highest</text>
<text x="500" y="160" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#313131">at least two angles per axis</text>
<text x="500" y="182" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#313131">zero gain outside the grid extent</text>
<text x="500" y="204" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#313131">gain at a grid point = co + cross, the sum of</text>
<text x="500" y="226" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12.5" fill="#313131">txAntennaCoGain + txAntennaCrossGain</text>
<text x="500" y="248" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#757575">the rx arrays follow the same layout and rules</text>
<rect x="150" y="470" width="12" height="12" rx="2" fill="#0074DF"/>
