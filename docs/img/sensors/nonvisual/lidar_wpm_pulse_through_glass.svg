<svg xmlns="http://www.w3.org/2000/svg" width="900" height="424" viewBox="0 0 900 424" role="img" aria-labelledby="title desc">
<title id="title">One pulse, two returns</title>
<desc id="desc">A pulse leaves the emitter and meets a glass pane: part of it returns to the detector from the pane and part continues to a wall behind it, whose return crosses the pane once on its way back and is attenuated. A time axis below shows the detector signal with two peaks above the detection threshold, an earlier one from the glass and a later one from the wall.</desc>
