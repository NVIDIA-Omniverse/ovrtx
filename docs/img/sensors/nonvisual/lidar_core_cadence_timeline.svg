<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580" role="img" aria-labelledby="title desc">
<title id="title">Three delivery cadences of one lidar on one timeline</title>
<desc id="desc">A time axis with scan boundaries at multiples of the scan period T and application steps of T/2. Accumulate (partialOutputs false, the default) returns one frame holding the whole scan on the step that completes it and nothing on the step in between. Partial (partialOutputs true) returns a slice on every step, and a window that crosses a scan boundary carries the end of one scan and the start of the next. Instant (instantLidar true) traces a whole scan as one flash at the start of every step; partialOutputs decides whether that scan is returned on every step or only on the step that completes the scan period.</desc>
