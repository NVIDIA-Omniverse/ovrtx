<text x="240" y="30" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#313131">One sensor. Scan period T = 1 /</text>
<text x="452.54" y="30" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="13" fill="#313131">omni:sensor:frameRate;</text>
<text x="630.11" y="30" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#313131">the application steps by T/2.</text>
