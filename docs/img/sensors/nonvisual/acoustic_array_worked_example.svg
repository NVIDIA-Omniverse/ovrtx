<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="390" viewBox="0 0 1180 390" role="img" aria-labelledby="title desc">
<title id="title">The worked two-mount acoustic array, seen from above</title>
<desc id="desc">Top view of the sensor frame with mounts m001 and m002 four meters ahead of the prim origin and one meter apart, both receiver groups listening, event 0 from m001 on channel id 0 and event 1 from m002 on channel id 1, each echo returning to both mounts, and the two-by-two grid of the four signal ways they fill.</desc>
