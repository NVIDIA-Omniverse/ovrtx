<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
<title id="title">Generic wpm model receiver connections</title>
<desc id="desc">Four logical connection examples. nton connects every transmitter to all active receivers. Zero-bloom 1to1 pairs equal flat element indices. map gives each transmitter in the selected pattern the same ordered group, here receiver indices 2, 0, 2 in slots 0, 1, 2, preserving the repeated receiver. Radius-one bloom on matching three-by-three row-major grids gives the interior transmitter at index 4 nine receiver slots, ordered row by row; the center is slot 4. Connections select receiver candidates, not guaranteed valid contributions, and bloom adds no emitted rays.</desc>
