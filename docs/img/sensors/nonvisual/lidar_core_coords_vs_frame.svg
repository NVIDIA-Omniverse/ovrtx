<svg xmlns="http://www.w3.org/2000/svg" width="1136" height="484" viewBox="0 0 1136 484" role="img" aria-labelledby="title desc">
<title id="title">One lidar return, two independent output choices</title>
<desc id="desc">A 2 by 2 grid. Columns: Cartesian and spherical components, chosen by elementsCoordsType. Rows: the sensor frame and the world frame, chosen by outputFrameOfReference. A top view of the scene shows the world origin, a displaced and rotated sensor and one return; each cell gives that return's three numbers for its combination. The delivered params coordsType and frameOfReference say which cell a frame is in.</desc>
