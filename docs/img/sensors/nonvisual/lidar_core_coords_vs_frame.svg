<text x="746.04" y="412" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#313131">say which cell you are in.</text>
<text x="384" y="432" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#757575">HitNormal</text>
<text x="454.12" y="432" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#757575">and</text>
<text x="481.8" y="432" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#757575">Velocity</text>
<text x="544.69" y="432" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#757575">are rotated into the chosen frame, never translated, and stay Cartesian in every cell.</text>
<text x="384" y="452" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#757575">A third frame choice,</text>
<text x="515.22" y="452" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#757575">CUSTOM</text>
<text x="563.66" y="452" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#757575">measures from a frame you place with</text>
<text x="801.44" y="452" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#757575">customFrameOfReferenceTrafo.</text>
