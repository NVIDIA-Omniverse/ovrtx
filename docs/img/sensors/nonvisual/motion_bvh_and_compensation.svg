<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="570" viewBox="0 0 1110 570" role="img" aria-labelledby="title desc">
<title id="title">Motion BVH and compensation state</title>
<desc id="desc">A grid of three rows sharing one time axis of a single scan while the sensor moves to the right toward a fixed pole. Row 1, motion BVH off: every ray leaves the frame-end pose and meets a scene that does not move, so the reported points show no motion. Row 2, motion BVH on and NONCOMPENSATED: each ray leaves the pose at its own tick and the reported pole looks slanted. Row 3, motion BVH on and COMPENSATED: the same hits, re-expressed in one frame, and the pole looks vertical. Two left columns show the two independent controls.</desc>
