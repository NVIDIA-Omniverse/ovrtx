<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-labelledby="title desc">
<title id="title">Companding alignment: a 12-bit code in a 16-bit unsigned integer</title>
<desc id="desc">Two 16-bit unsigned integers drawn as rows of bit cells numbered 15 to 0. In the upper row the 12-bit code occupies bits 15 to 4 and bits 3 to 0 are padding; in the lower row the code occupies bits 11 to 0 and bits 15 to 12 are padding.</desc>
