<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Near limit from maximum disparity, schema defaults</title>
<desc id="desc">The effective near limit is the greater of minDistance and the disparity-derived distance. Disparity in pixels against distance in meters at the schema defaults: a 1280-pixel-wide product reaches maxDisparityPixel = 110 at about 0.45 m, below minDistance = 0.5 m, so minDistance determines the near limit. A 2560-pixel-wide product reaches the maximum disparity at about 0.9 m, which determines its near limit.</desc>
