<rect x="250" y="102" width="250" height="64" rx="6" fill="#F2F2F2"/>
<circle cx="272" cy="134" r="11" fill="#757575"/>
<text x="272" y="138.5" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<text x="391.5" y="139" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#313131" text-anchor="middle" font-weight="bold">Read the rendered image</text>
<line x1="375" y1="167" x2="375" y2="180" stroke="#757575" stroke-width="2" marker-end="url(#arrow-757575-2)"/>
<line x1="501" y1="134" x2="608" y2="134" stroke="#757575" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-757575-2)"/>
<text x="560" y="127" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#757575" text-anchor="middle">optional tap</text>
<rect x="620" y="102" width="304" height="64" rx="6" fill="#fff" stroke="#C0C0C0" stroke-width="1.5" stroke-dasharray="4.5 3"/>
<text x="632" y="123" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12.5" fill="#313131">OmniCameraSensorInputSource</text>
<text x="632" y="141" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#757575">4 components, 16-bit float RGBA</text>
<rect x="250" y="192" width="250" height="64" rx="6" fill="#F2F2F2"/>
<circle cx="272" cy="224" r="11" fill="#757575"/>
<text x="272" y="228.5" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<text x="391.5" y="229" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#313131" text-anchor="middle" font-weight="bold">Color correction</text>
<line x1="375" y1="257" x2="375" y2="270" stroke="#757575" stroke-width="2" marker-end="url(#arrow-757575-2)"/>
<line x1="501" y1="224" x2="608" y2="224" stroke="#757575" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-757575-2)"/>
