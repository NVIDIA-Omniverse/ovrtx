<svg xmlns="http://www.w3.org/2000/svg" width="948" height="830.67" viewBox="0 0 948 830.67" role="img" aria-labelledby="title desc">
<title id="title">Camera generic core model: pipeline stages and outputs</title>
<desc id="desc">The seven stages in order from HdrColor to the two primary outputs: read the rendered image, color correction, color filter array, sensor noise, companding, ISP and YUV decode, each labeled with the AOV it publishes and that AOV's element format. OmniCameraSensorPreIsp is marked as the primary RAW output after companding and OmniCameraSensorPostIsp as the primary processed output after the YUV decode; the other five AOVs are marked as optional taps.</desc>
<defs><marker id="arrow-757575-2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="0" refY="4.5" orient="auto" overflow="visible"><path d="M0,0 L11,4.5 L0,9 z" fill="#757575"/></marker><marker id="arrow-76b900-2p5" markerUnits="userSpaceOnUse" markerWidth="13.75" markerHeight="11.25" refX="0" refY="5.62" orient="auto" overflow="visible"><path d="M0,0 L13.75,5.62 L0,11.25 z" fill="#76B900"/></marker></defs>
<rect width="948" height="830.67" fill="#fff"/>
