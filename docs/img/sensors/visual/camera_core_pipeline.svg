<line x1="24" y1="762" x2="40" y2="762" stroke="#76B900" stroke-width="2"/>
<text x="47" y="766.32" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#313131">primary output</text>
<line x1="159.37" y1="762" x2="175.37" y2="762" stroke="#757575" stroke-width="2" stroke-dasharray="6 4"/>
<text x="182.37" y="766.32" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#313131">optional tap</text>
<line x1="276.51" y1="762" x2="292.51" y2="762" stroke="#0074DF" stroke-width="2"/>
<text x="299.51" y="766.32" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#313131">pre-ISP pipeline, stages 1–5</text>
<line x1="487.88" y1="762" x2="503.88" y2="762" stroke="#952FC6" stroke-width="2"/>
<text x="510.88" y="766.32" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#313131">full pipeline, stages 1–7</text>
<text x="24" y="786" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#757575">Request at least one primary output. Requesting both builds the full pipeline and also publishes the companded RAW image. Diagnostic taps publish only</text>
