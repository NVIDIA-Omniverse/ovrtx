<circle cx="272" cy="694" r="11" fill="#757575"/>
<text x="272" y="698.5" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">7</text>
<text x="391.5" y="699" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#313131" text-anchor="middle" font-weight="bold">YUV decode</text>
<line x1="501" y1="694" x2="605.25" y2="694" stroke="#76B900" stroke-width="2.5" marker-end="url(#arrow-76b900-2p5)"/>
<text x="560" y="687" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#76B900" text-anchor="middle" font-weight="bold">primary output</text>
