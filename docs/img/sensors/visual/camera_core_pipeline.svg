<text x="632" y="303" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12.5" fill="#313131">OmniCameraSensorPostCfa</text>
<text x="632" y="321" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#757575">1 component, 32-bit unsigned integer, or 32-bit</text>
<text x="632" y="338" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#757575">float with FLOAT32</text>
