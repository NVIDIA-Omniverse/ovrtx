<circle cx="272" cy="494" r="11" fill="#757575"/>
<text x="272" y="498.5" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">5</text>
<text x="391.5" y="499" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#313131" text-anchor="middle" font-weight="bold">Companding</text>
<line x1="375" y1="527" x2="375" y2="540" stroke="#757575" stroke-width="2" marker-end="url(#arrow-757575-2)"/>
<line x1="501" y1="494" x2="605.25" y2="494" stroke="#76B900" stroke-width="2.5" marker-end="url(#arrow-76b900-2p5)"/>
<text x="560" y="487" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#76B900" text-anchor="middle" font-weight="bold">primary output</text>
<text x="560" y="509" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#76B900" text-anchor="middle">(RAW)</text>
<rect x="620" y="462" width="304" height="64" rx="6" fill="#fff" stroke="#76B900" stroke-width="2.5"/>
