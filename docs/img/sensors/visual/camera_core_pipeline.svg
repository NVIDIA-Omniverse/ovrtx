<text x="632" y="393" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12.5" fill="#313131">OmniCameraSensorPostNoise</text>
<text x="632" y="411" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#757575">1 component, 32-bit unsigned integer</text>
