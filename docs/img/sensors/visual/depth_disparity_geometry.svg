<title id="title">Disparity geometry</title>
<desc id="desc">Two imagers separated by a baseline observe one point at distance d; the point projects to different pixel columns on the two imagers, and the column difference is the disparity. An inset plots the applied confidence threshold against the authored threshold.</desc>
