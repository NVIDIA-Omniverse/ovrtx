<svg xmlns="http://www.w3.org/2000/svg" width="1178" height="435" viewBox="0 0 1178 435" role="img" aria-labelledby="title desc">
<title id="title">One UsdShade material, two systems</title>
<desc id="desc">One UsdShade material serves two systems. Geometry binds it through material:binding; the visual shader network feeds visual rendering, and the three omni:simready:nonvisual attributes feed the lidar, radar and acoustic models.</desc>
