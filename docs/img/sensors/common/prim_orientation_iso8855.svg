<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">Prim orientation and the ISO 8855 output frame</title>
<desc id="desc">A sensor prim seen from behind in a Z-up stage. Its camera-style local axes after xformOp:rotateXYZ = (90, 0, -90): local -Z is forward along world +X, local +Y is up along world +Z, local +X is right along world -Y. The ISO 8855 output frame at the same origin, +X forward (azimuth 0), +Y left, +Z up, coincides with the world axes. A target straight ahead of the prim is reported on output +X.</desc>
<defs><marker id="arrow-0074df-2p5" markerUnits="userSpaceOnUse" markerWidth="13.75" markerHeight="11.25" refX="0" refY="5.62" orient="auto" overflow="visible"><path d="M0,0 L13.75,5.62 L0,11.25 z" fill="#0074DF"/></marker><marker id="arrow-757575-1p5" markerUnits="userSpaceOnUse" markerWidth="8.25" markerHeight="6.75" refX="0" refY="3.38" orient="auto" overflow="visible"><path d="M0,0 L8.25,3.38 L0,6.75 z" fill="#757575"/></marker><marker id="arrow-952fc6-2p5" markerUnits="userSpaceOnUse" markerWidth="13.75" markerHeight="11.25" refX="0" refY="5.62" orient="auto" overflow="visible"><path d="M0,0 L13.75,5.62 L0,11.25 z" fill="#952FC6"/></marker><marker id="arrow-c0c0c0-1p5" markerUnits="userSpaceOnUse" markerWidth="8.25" markerHeight="6.75" refX="0" refY="3.38" orient="auto" overflow="visible"><path d="M0,0 L8.25,3.38 L0,6.75 z" fill="#C0C0C0"/></marker></defs>
