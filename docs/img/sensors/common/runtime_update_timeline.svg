<svg xmlns="http://www.w3.org/2000/svg" width="1106" height="460" viewBox="0 0 1106 460" role="img" aria-labelledby="title desc">
<title id="title">A parameter edit on a running sensor</title>
<desc id="desc">How an edit lands on a running sensor. The frame in flight finishes with its starting values; the next frame built after the edit uses the new ones. A refused batch changes nothing, and every later frame stays on the accepted configuration until the offending value is corrected.</desc>
