<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="372" viewBox="0 0 1000 372" role="img" aria-labelledby="title desc">
<title id="title">Capacity versus count</title>
<desc id="desc">A per-entry channel is allocated for Nmax entries (its shape, also the maxPoints param). The delivered entries, indices [0, Counts[0]), sit at the front; inside that range an entry is a real return when Flags[i] &amp; 0x40 is set, and a few entries have the bit clear. Everything past Counts[0] holds whatever it held before and is never read.</desc>
<defs><marker id="arrow-313131-1p5" markerUnits="userSpaceOnUse" markerWidth="8.25" markerHeight="6.75" refX="0" refY="3.38" orient="auto" overflow="visible"><path d="M0,0 L8.25,3.38 L0,6.75 z" fill="#313131"/></marker></defs>
<rect width="1000" height="372" fill="#fff"/>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C0C0C0" stroke-width="1.5"/></pattern></defs>
<text x="80" y="64" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#313131" font-weight="bold">per-entry channel</text>
<text x="219.36" y="64" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#757575">(shape = capacity Nmax = maxPoints)</text>
