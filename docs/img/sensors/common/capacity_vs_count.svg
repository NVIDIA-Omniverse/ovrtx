<rect x="80" y="292" width="12" height="12" rx="2" fill="#76B900"/>
<text x="99" y="301.96" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#313131">Flags[i] &amp; 0x40 set: real entry</text>
<rect x="285.74" y="292" width="12" height="12" rx="2" fill="#C0C0C0"/>
<text x="304.74" y="301.96" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#313131">bit clear: not a return</text>
<rect x="444.76" y="292" width="12" height="12" rx="2" fill="url(#hatch)" stroke="#757575" stroke-width="1"/>
<text x="463.76" y="301.96" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#313131">past Counts[0]: never read</text>
<rect x="66" y="333" width="4" height="17" rx="1" fill="#EF9100"/>
<text x="80" y="346" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#313131">read Counts[0], not the tensor's length; test the bit (Flags[i] &amp; 0x40), not == 0x40</text>
