<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="418" viewBox="0 0 1200 418" role="img" aria-labelledby="title desc">
<title id="title">From a step result to a mapped output</title>
<desc id="desc">A step result holds zero or more frames per RenderProduct, each with its own capture window (start_time .. end_time) that may begin before the step's simulation_start_time. A frame holds one render var output per RenderVar, keyed by the RenderVar's prim path. Mapping an output with DEFAULT, CPU, CUDA or CUDA_ARRAY hands you a container: name, type, status, version and one wait_event, a list of named tensors on the mapped device and a list of named host-resident params.</desc>
<defs><marker id="arrow-757575-1" markerUnits="userSpaceOnUse" markerWidth="5.5" markerHeight="4.5" refX="0" refY="2.25" orient="auto" overflow="visible"><path d="M0,0 L5.5,2.25 L0,4.5 z" fill="#757575"/></marker><marker id="arrow-757575-2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="0" refY="4.5" orient="auto" overflow="visible"><path d="M0,0 L11,4.5 L0,9 z" fill="#757575"/></marker><marker id="arrow-757575-2p5" markerUnits="userSpaceOnUse" markerWidth="13.75" markerHeight="11.25" refX="0" refY="5.62" orient="auto" overflow="visible"><path d="M0,0 L13.75,5.62 L0,11.25 z" fill="#757575"/></marker></defs>
