<text x="46" y="333.95" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#757575">precedes simulation_start_time. In C the frame fields are</text>
<text x="46" y="349.9" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#757575">frame_start_time and frame_end_time.</text>
