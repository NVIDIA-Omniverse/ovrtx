<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="614" viewBox="0 0 1120 614" role="img" aria-labelledby="title desc">
<title id="title">Sensor prim, applied schema and model</title>
<desc id="desc">On a typed sensor prim the prim type and the single-apply OmniSensorGeneric&lt;Model&gt;API schema select the model. The schema prepends OmniSensorAPI and the first instance of each multiple-apply schema the model needs, which fill the omni:sensor:*, omni:sensor:&lt;Model&gt;:* and omni:sensor:&lt;Model&gt;:&lt;group&gt;:&lt;instance&gt;:* attribute namespaces on the prim. On a Camera, the RenderProduct's requested output enables the model and the schema supplies its parameters.</desc>
<defs><marker id="arrow-757575-1p5" markerUnits="userSpaceOnUse" markerWidth="8.25" markerHeight="6.75" refX="0" refY="3.38" orient="auto" overflow="visible"><path d="M0,0 L8.25,3.38 L0,6.75 z" fill="#757575"/></marker><marker id="arrow-757575-2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="0" refY="4.5" orient="auto" overflow="visible"><path d="M0,0 L11,4.5 L0,9 z" fill="#757575"/></marker><marker id="arrow-76b900-1p5" markerUnits="userSpaceOnUse" markerWidth="8.25" markerHeight="6.75" refX="0" refY="3.38" orient="auto" overflow="visible"><path d="M0,0 L8.25,3.38 L0,6.75 z" fill="#76B900"/></marker><marker id="arrow-76b900-2p5" markerUnits="userSpaceOnUse" markerWidth="13.75" markerHeight="11.25" refX="0" refY="5.62" orient="auto" overflow="visible"><path d="M0,0 L13.75,5.62 L0,11.25 z" fill="#76B900"/></marker></defs>
