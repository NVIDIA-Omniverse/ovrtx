<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">The pieces of the worked lidar example</title>
<desc id="desc">The lidar prim, the RenderProduct pointing at it through rel camera and at the PointCloud RenderVar through rel orderedVars, and the step result leading to the mapped channel tensors and params</desc>
<defs><marker id="arrow-757575-2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="0" refY="4.5" orient="auto" overflow="visible"><path d="M0,0 L11,4.5 L0,9 z" fill="#757575"/></marker></defs>
<rect width="1200" height="660" fill="#fff"/>
<text x="24" y="34" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#757575" font-weight="bold">Authored in the scene</text>
<rect x="24" y="50" width="382" height="172" rx="8" fill="#F2F2F2"/>
<text x="38" y="74" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#313131" font-weight="bold">Sensor prim</text>
<text x="38" y="93" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131">/World/Lidar</text>
<text x="38" y="111" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#757575">where the sensor is and how it behaves</text>
<line x1="38" y1="120" x2="392" y2="120" stroke="#C0C0C0" stroke-width="1"/>
<text x="38" y="138" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131">OmniLidar + OmniSensorGenericLidarCoreAPI</text>
<text x="38" y="156" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#757575">selects the Lidar generic core model</text>
<text x="38" y="174" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131">omni:sensor:Core:elementsCoordsType = "CARTESIAN"</text>
<text x="38" y="192" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131">omni:sensor:Core:includeInvalidPoints = false</text>
<text x="38" y="210" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131">omni:sensor:frameRate = (10, 1)</text>
<rect x="502" y="92" width="282" height="88" rx="8" fill="#F2F2F2"/>
<text x="516" y="116" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#313131" font-weight="bold">RenderProduct</text>
<text x="516" y="135" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131">/World/Render/Products/LidarProduct</text>
<text x="516" y="153" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#757575">the request</text>
<rect x="914" y="50" width="254" height="172" rx="8" fill="#F2F2F2"/>
<text x="928" y="74" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#313131" font-weight="bold">RenderVar</text>
<text x="928" y="93" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131">/World/Render/Vars/PointCloud</text>
<text x="928" y="111" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#757575">one requested output</text>
<line x1="928" y1="120" x2="1154" y2="120" stroke="#C0C0C0" stroke-width="1"/>
<text x="928" y="138" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131">sourceName = "PointCloud"</text>
<text x="928" y="156" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131">channels = ["Coordinates",</text>
<text x="950" y="174" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131">"Intensity", "Counts",</text>
<text x="950" y="192" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#313131">"TimeOffsetNs"]</text>
<line x1="502" y1="136" x2="417" y2="136" stroke="#757575" stroke-width="2" marker-end="url(#arrow-757575-2)"/>
<text x="454" y="128" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#757575" text-anchor="middle">rel camera</text>
<line x1="784" y1="136" x2="903" y2="136" stroke="#757575" stroke-width="2" marker-end="url(#arrow-757575-2)"/>
<text x="849" y="128" font-family="'Roboto Mono','DejaVu Sans Mono',Menlo,monospace" font-size="12" fill="#757575" text-anchor="middle">rel orderedVars</text>
<text x="24" y="330" font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#757575" font-weight="bold">In your program</text>
